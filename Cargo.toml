[package]
name = "onec-buddy-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
description = "Local stdio MCP server for 1C:Enterprise development assistance"
publish = false
build = "build.rs"

[package.metadata.winresource]
FileDescription = "onec-buddy MCP server"
ProductName = "onec-buddy"
Comments = "AGPL-3.0-only"
OriginalFilename = "onec-buddy-mcp.exe"
InternalName = "onec-buddy-mcp"

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.33"
httpdate = "=1.0.3"
icu_normalizer = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
reqwest = { version = "=0.13.4", default-features = false, features = [
    "brotli",
    "deflate",
    "gzip",
    "http2",
    "json",
    "rustls",
    "stream",
] }
rmcp = { version = "=2.2.0", default-features = false, features = [
    "macros",
    "server",
    "transport-async-rw",
    "transport-io",
] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "=0.7.19", features = ["codec", "rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
] }

[build-dependencies]
winresource = "=0.1.31"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
