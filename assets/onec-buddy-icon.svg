<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>onec-buddy connection mark</title>
  <defs>
    <linearGradient id="background" x1="72" y1="48" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172942"/>
      <stop offset="0.55" stop-color="#102038"/>
      <stop offset="1" stop-color="#091424"/>
    </linearGradient>
    <radialGradient id="surface-light" cx="0" cy="0" r="1" gradientTransform="translate(150 112) rotate(45) scale(390)">
      <stop stop-color="#33577e" stop-opacity="0.54"/>
      <stop offset="0.72" stop-color="#1d3654" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="126" y1="130" x2="390" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe39a"/>
      <stop offset="0.38" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#d79525"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020812" flood-opacity="0.44"/>
    </filter>
    <filter id="mark-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#030914" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#background)" filter="url(#tile-shadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#surface-light)"/>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#517397" stroke-opacity="0.34" stroke-width="8"/>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#mark-shadow)">
    <path d="M181 168C218 181 224 216 256 242" stroke-width="42"/>
    <path d="M181 344C218 331 224 296 256 270" stroke-width="42"/>
    <path d="M294 256H329" stroke-width="42"/>
    <circle cx="150" cy="156" r="39" fill="#11223a" stroke-width="24"/>
    <circle cx="150" cy="356" r="39" fill="#11223a" stroke-width="24"/>
    <circle cx="366" cy="256" r="39" fill="#11223a" stroke-width="24"/>
    <circle cx="256" cy="256" r="50" fill="url(#gold)" stroke-width="10"/>
  </g>

  <circle cx="256" cy="256" r="18" fill="#102039"/>
  <circle cx="244" cy="240" r="8" fill="#fff4ca" fill-opacity="0.72"/>
